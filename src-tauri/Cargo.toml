[package]
name = "krispoint"
version = "1.0.0"
description = "KrisPoint - Professional Radiology Reporting System with Voice Dictation"
authors = ["Dr. Dagger"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = ["devtools"] }
tauri-plugin-log = "2.0"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
tungstenite = "0.24"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
tempfile = "3"
rfd = "0.15"
openssl = "0.10"
bcrypt = "0.17"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", features = ["json", "blocking", "native-tls-vendored"] }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
