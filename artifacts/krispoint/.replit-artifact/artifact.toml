kind = "web"
previewPath = "/"
title = "KrisPoint"
description = "KrisPoint Hospital clinical reporting and dictation application, preserving the existing product interface, workflows, licensing, voice transcription, and AI-assisted report polishing."
version = "1.0.0"
id = "artifacts/krispoint"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25037

[services.development]
run = 'VITE_KRISPOINT_EDITION=solo DATABASE_URL="sqlite:///tmp/krispoint-solo-preview.db" KRISPOINT_SOLO_DB_PATH="/tmp/krispoint-solo-preview.db" SOLO_ENCRYPTION_KEY="$SESSION_SECRET-solo-encryption" SOLO_AUDIT_KEY="$SESSION_SECRET-solo-audit" LICENSE_SERVER_URL="https://license.krispoint.com.gh" KRISPOINT_LICENSE_SERVER_URL="https://license.krispoint.com.gh" KRISPOINT_AI_GATEWAY_URL="https://ai.krispoint.com.gh" KRISPOINT_REMOTE_AI_ENABLED="true" pnpm --filter @workspace/krispoint run dev'

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/krispoint", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"
VITE_KRISPOINT_EDITION = "hospital"

[services.production.run]
args = [ "sh", "-c", ": \"${SESSION_SECRET:?SESSION_SECRET is required}\"; export VOICE_CLIENT_TOKEN=\"${SESSION_SECRET}-hospital-voice\"; pnpm run db:migrate:hospital && exec node server-https.js" ]

[services.production.run.env]
PORT = "25037"
NODE_ENV = "production"
VITE_KRISPOINT_EDITION = "hospital"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "25037"
BASE_PATH = "/"
