kind = "api"
previewPath = "/health"
title = "KrisPoint AI Gateway"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "KrisPoint AI Gateway"
paths = ["/health", "/v1"]

[services.development]
run = "pnpm --filter @workspace/ai-gateway run start"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/ai-gateway", "run", "test"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "artifacts/api-server/src/server.mjs"]

[services.production.run.env]
HOST = "0.0.0.0"
PORT = "8080"
NODE_ENV = "production"
AI_PROVIDER = "groq"
KRISPOINT_LICENSE_SERVER_URL = "https://license.krispoint.com.gh"

[services.production.health.startup]
path = "/health"
