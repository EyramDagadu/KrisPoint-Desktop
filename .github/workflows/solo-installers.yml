name: Solo installers

on:
  workflow_dispatch:
  push:
    tags: ['solo-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
          - os: macos-14-xlarge
            artifact: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      INCLUDE_MEDASR: '1'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r vosk-server/requirements.txt pyinstaller
      - run: python vosk-server/tests/test_parent_watchdog.py
      - run: npm run test:solo:installer
      - run: npm run build:solo:installer
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-solo-installer.ps1
      - if: runner.os == 'macOS'
        run: ./scripts/verify-solo-installer-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: krispoint-solo-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/dmg/*
          if-no-files-found: error