name: Solo installers

on:
  workflow_dispatch:
  push:
    tags: ['solo-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
            bundle: msi
          - os: macos-14
            artifact: macos-apple-silicon
            bundle: dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      INCLUDE_MEDASR: '1'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Use public npm registry
        run: npm config set registry https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r vosk-server/requirements.txt pyinstaller
      - run: python vosk-server/tests/test_parent_watchdog.py
      - run: pnpm run test:solo:installer
      - name: Prepare Windows release signing
        id: windows-signing
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/solo-v')
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          KRISPOINT_LICENSE_PUBLIC_KEY: ${{ secrets.KRISPOINT_LICENSE_PUBLIC_KEY }}
        run: ./scripts/prepare-solo-windows-signing.ps1
      - name: Prepare macOS release signing
        id: macos-signing
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/solo-v')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KRISPOINT_LICENSE_PUBLIC_KEY: ${{ secrets.KRISPOINT_LICENSE_PUBLIC_KEY }}
        run: ./scripts/prepare-solo-macos-signing.sh
      - name: Build unsigned test installer
        if: ${{ !startsWith(github.ref, 'refs/tags/solo-v') }}
        run: pnpm exec tauri build --bundles ${{ matrix.bundle }}
      - name: Build signed release installer
        if: startsWith(github.ref, 'refs/tags/solo-v')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          VITE_KRISPOINT_LICENSE_PUBLIC_KEY: ${{ secrets.KRISPOINT_LICENSE_PUBLIC_KEY }}
        run: pnpm exec tauri build --bundles ${{ matrix.bundle }} --config src-tauri/tauri.signed.conf.json
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-solo-installer.ps1
      - if: runner.os == 'macOS'
        run: ./scripts/verify-solo-installer-macos.sh
      - name: Verify Windows release signature
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/solo-v')
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows installer signature is not valid: $($signature.Status)"
          }
          & signtool verify /pa /all /v $installer.FullName
      - name: Notarize and staple macOS release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/solo-v')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          app="$(find src-tauri/target/release/bundle/macos -name '*.app' -print -quit)"
          test -n "${app}"
          codesign --verify --strict --verbose=2 "${app}"
          while IFS= read -r executable; do
            if file "${executable}" | grep -q 'Mach-O'; then
              codesign --verify --strict --verbose=2 "${executable}"
            fi
          done < <(find "${app}" -type f -perm -111)
          dmg="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "${dmg}"
          xcrun notarytool submit "${dmg}" \
            --key "${{ steps.macos-signing.outputs.api-key-path }}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait
          xcrun stapler staple "${dmg}"
          xcrun stapler validate "${dmg}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg}"
      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/solo-v')
        run: security delete-keychain "${{ steps.macos-signing.outputs.keychain-path }}" || true
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: krispoint-solo-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/dmg/*
          if-no-files-found: error